<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IncentiveLab</title>
<meta name="description" content="1인 개발 모바일 게임 스튜디오 IncentiveLab">
<meta property="og:type" content="website">
<meta property="og:title" content="IncentiveLab">
<meta property="og:description" content="1인 개발 모바일 게임 스튜디오">
<meta property="og:image" content="https://pbjgit.github.io/twofront/feature.png">
<style>
  :root { --bg:#0b1322; --panel:#141f36; --ink:#f3f6fb; --sub:#a9b6cc; --gold:#ffc94a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; padding:40px 16px 48px; }
  h1 { margin:0; font-size:32px; }
  .sub { color:var(--sub); margin:4px 0 32px; }
  h2 { font-size:18px; color:var(--gold); margin:0 0 12px; }
  .game { display:flex; gap:16px; align-items:center; background:var(--panel); border-radius:14px; padding:14px; text-decoration:none; color:var(--ink); margin-bottom:12px; }
  .game img { width:84px; height:84px; border-radius:18px; flex:none; }
  .game b { font-size:20px; display:block; }
  .game span { color:var(--sub); font-size:15px; }
  footer { color:var(--sub); font-size:14px; margin-top:36px; }
  footer a { color:var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <h1>IncentiveLab</h1>
  <p class="sub">1인 개발 모바일 게임</p>

  <h2>게임</h2>
  <a class="game" href="twofront/">
    <img src="twofront/icon.png" alt="">
    <div><b>양면초가 디펜스</b><span>양쪽에서 몰려오는 적을 막는 방치형 디펜스 · Android</span></div>
  </a>
  <!-- 다른 게임은 위 <a class="game"> 한 덩어리를 복사해 추가 -->

  <footer>문의 <a href="mailto:incentivelab.help@gmail.com">incentivelab.help@gmail.com</a></footer>
</div>
</body>
</html>
